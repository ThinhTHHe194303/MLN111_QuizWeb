<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b6852">
  <meta name="description" content="Ôn tập trắc nghiệm Triết học Mác – Lênin theo chương, xáo trộn đề và xem giải thích đáp án.">
  <title>Ôn tập · Triết học Mác – Lênin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Apply a saved theme before first paint to avoid a light/dark flash.
    try {
      var t = JSON.parse(localStorage.getItem('ontap:settings:v1')).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Đến nội dung chính</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="brand" data-action="home" aria-label="Ôn tập, về trang chủ">
        <span class="brand-icon" aria-hidden="true">MLN<br>111</span>
        <span class="brand-text">ôn tập<small>TRIẾT HỌC MÁC – LÊNIN</small></span>
      </button> 
      <nav class="crumbs" aria-label="Vị trí hiện tại">
        <span>Góc ôn tập</span><span class="divider" aria-hidden="true">/</span><b id="breadcrumb">Tạo bài luyện tập</b>
      </nav>
      <button type="button" class="icon-button" id="theme-toggle" data-action="theme" aria-label="Chuyển giao diện sáng/tối">☾</button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div class="loading" role="status">Đang tải ngân hàng câu hỏi…</div>
  </main>
  <footer class="footer">
    <span>Ôn tập · Triết học Mác – Lênin</span>
    <span>Hiểu bản chất, nhớ lâu hơn.</span>
  </footer>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <h2 id="dialog-title"></h2>
    <p id="dialog-text"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-light" id="dialog-cancel">Hủy</button>
      <button type="button" class="btn btn-primary" id="dialog-ok">OK</button>
    </div>
  </dialog>
  <noscript>Vui lòng bật JavaScript để làm bài trắc nghiệm.</noscript>
</body>
</html>
